<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Davbot APK Store</title>

<meta name="theme-color"
content="#020617">

<link rel="icon"
href="https://i.ibb.co/chckV4z9/Dav-Bot-IA-128x128-4ko.webp">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

:root{

--bg:#020617;
--card:#081126;
--blue:#1e90ff;
--blue2:#4da3ff;
--text:#ffffff;
--border:#1e90ff33;

}

body{

background:var(--bg);

color:var(--text);

min-height:100vh;

}

a{

text-decoration:none;

color:inherit;

}

img{

max-width:100%;

display:block;

}

header{

position:sticky;

top:0;

z-index:100;

background:#020617ee;

backdrop-filter:blur(15px);

border-bottom:1px solid var(--border);

padding:15px;

}

.topbar{

display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

}

.logo{

display:flex;

align-items:center;

gap:12px;

}

.logo img{

width:55px;

height:55px;

border-radius:18px;

box-shadow:0 0 15px var(--blue);

}

.logo h1{

font-size:22px;

color:var(--blue2);

}

.user-btn{

width:45px;

height:45px;

border:none;

border-radius:50%;

background:var(--card);

color:white;

font-size:18px;

cursor:pointer;

border:1px solid var(--border);

}

.container{

width:95%;

max-width:1200px;

margin:auto;

padding:20px;

}

.search-box{

display:flex;

gap:10px;

margin-top:20px;

}

.search-box input{

flex:1;

padding:15px;

border:none;

outline:none;

border-radius:15px;

background:var(--card);

color:white;

border:1px solid var(--border);

}

.search-btn{

width:60px;

border:none;

border-radius:15px;

background:var(--blue);

color:white;

font-size:20px;

cursor:pointer;

}

.banner{

margin-top:20px;

background:linear-gradient(135deg,#081126,#0d47a1,#081126);

border-radius:25px;

padding:25px;

display:flex;

align-items:center;

justify-content:space-between;

gap:20px;

box-shadow:0 0 20px #1e90ff44;

}

.banner h2{

font-size:28px;

margin-bottom:10px;

}

.banner p{

opacity:.85;

line-height:1.6;

}

.banner img{

width:110px;

height:110px;

border-radius:25px;

box-shadow:0 0 20px var(--blue);

}

.categories{

display:flex;

gap:10px;

overflow:auto;

padding:20px 0;

}

.categories::-webkit-scrollbar{

display:none;

}

.category{

padding:10px 18px;

background:var(--card);

border:1px solid var(--border);

border-radius:30px;

white-space:nowrap;

cursor:pointer;

transition:.3s;

}

.category.active,

.category:hover{

background:var(--blue);

}

.publish{

display:flex;

align-items:center;

justify-content:center;

gap:10px;

width:100%;

padding:16px;

margin-bottom:20px;

border-radius:18px;

background:var(--blue);

color:white;

font-weight:600;

font-size:16px;

border:none;

cursor:pointer;

box-shadow:0 0 20px #1e90ff55;

}

.apps{

display:grid;

gap:20px;

}
/* =======================
   CARTES APPLICATIONS
======================= */

.app-card{

background:var(--card);

border:1px solid var(--border);

border-radius:22px;

padding:18px;

box-shadow:0 0 15px #1e90ff22;

transition:.3s;

}

.app-card:hover{

transform:translateY(-5px);

box-shadow:0 0 25px #1e90ff55;

}

.app-top{

display:flex;

align-items:center;

gap:15px;

}

.app-icon{

width:85px;

height:85px;

border-radius:20px;

object-fit:cover;

border:2px solid var(--blue);

box-shadow:0 0 15px var(--blue);

}

.app-info{

flex:1;

}

.app-name{

font-size:22px;

font-weight:700;

color:var(--blue2);

margin-bottom:5px;

}

.developer{

font-size:13px;

opacity:.8;

margin-bottom:6px;

}

.description{

font-size:14px;

opacity:.9;

line-height:1.5;

margin:15px 0;

}

.tags{

display:flex;

gap:8px;

flex-wrap:wrap;

margin:15px 0;

}

.tag{

padding:6px 12px;

border-radius:20px;

background:#0f1c36;

border:1px solid var(--border);

font-size:12px;

}

.stars{

color:gold;

font-size:18px;

margin:10px 0;

}

.downloads{

font-size:13px;

opacity:.8;

margin-top:8px;

}

.actions{

display:flex;

gap:10px;

margin-top:18px;

}

.btn{

flex:1;

padding:13px;

border:none;

border-radius:15px;

cursor:pointer;

font-weight:600;

transition:.3s;

}

.btn-view{

background:#0f1c36;

color:#fff;

border:1px solid var(--border);

}

.btn-download{

background:var(--blue);

color:#fff;

}

.btn:hover{

transform:scale(1.03);

}

/* =======================
   MODAL
======================= */

.popup{

position:fixed;

inset:0;

background:#000b;

display:flex;

align-items:center;

justify-content:center;

z-index:999;

}

.hidden{

display:none;

}

.modal{

width:92%;

max-width:420px;

background:#081126;

border-radius:22px;

padding:22px;

text-align:center;

border:1px solid var(--border);

box-shadow:0 0 25px #1e90ff66;

}

.modal h2{

margin:15px 0;

color:var(--blue2);

}

.progress-box{

width:100%;

height:8px;

background:#111827;

border-radius:20px;

overflow:hidden;

margin:15px 0;

}

.progress{

width:0%;

height:100%;

background:var(--blue);

transition:.3s;

}

/* =======================
   RESPONSIVE
======================= */

@media(max-width:700px){

.banner{

flex-direction:column;

text-align:center;

}

.banner img{

width:90px;

height:90px;

}

.app-top{

align-items:flex-start;

}

.app-icon{

width:70px;

height:70px;

}

.app-name{

font-size:18px;

}

}

</style>

</head>

<body>
<!-- ================= HEADER ================= -->

<header>

<div class="topbar">

<div class="logo">

<img src="https://i.ibb.co/chckV4z9/Dav-Bot-IA-128x128-4ko.webp">

<h1>

DAVBOT APK STORE

</h1>

</div>

<button
class="user-btn"
id="profileBtn">

👤

</button>

</div>





<!-- ================= RECHERCHE ================= -->

<div class="search-box">

<input

type="text"

id="searchInput"

placeholder="🔎 Rechercher une application...">

<button
class="search-btn">

🔍

</button>

</div>

</header>





<!-- ================= CONTENU ================= -->

<div class="container">




<!-- ================= BANNIÈRE ================= -->

<div class="banner">

<div>

<h2>

⚡ Davbot APK Store

</h2>

<p>

Téléchargez des applications Android,
des outils, des jeux, des VPN et des applications IA publiés par les développeurs.

</p>

</div>


</div>






<!-- ================= CATÉGORIES ================= -->

<div class="categories">

<button
class="category active"
data-category="Tous">

Tous

</button>

<button
class="category"
data-category="IA">

IA

</button>

<button
class="category"
data-category="VPN">

VPN

</button>

<button
class="category"
data-category="Jeux">

Jeux

</button>

<button
class="category"
data-category="Outils">

Outils

</button>

<button
class="category"
data-category="Social">

Social

</button>

</div>






<!-- ================= BOUTON UPLOAD ================= -->

<button

class="publish"

id="uploadBtn">

➕ Publier une application

</button>






<!-- ================= LISTE DES APPLICATIONS ================= -->

<div

id="apps"

class="apps">

<!-- Les applications seront chargées automatiquement par app.js -->

</div>

</div>
<!-- ================= MODAL DETAILS APP ================= -->

<div id="detailsModal" class="popup hidden">

<div class="modal">


<img id="detailIcon"
class="app-icon">


<h2 id="detailName">
Nom application
</h2>


<div id="detailStars"
class="stars">

★★★★★

</div>


<p id="detailDesc"
class="description">

Description

</p>



<div class="tags">

<span id="detailVersion"
class="tag">

Version

</span>


<span id="detailSize"
class="tag">

Taille

</span>


<span id="detailCategory"
class="tag">

Catégorie

</span>

</div>



<p id="detailDownloads"
class="downloads">

📥 0 téléchargements

</p>




<div class="actions">


<button
class="btn btn-download"
id="installBtn">

📥 Installer

</button>


<button
class="btn btn-view"
onclick="closeDetails()">

Fermer

</button>


</div>






<!-- Zone propriétaire -->

<div id="ownerActions"
style="display:none;margin-top:20px;">


<button
class="btn btn-view"
id="editBtn">

✏️ Modifier

</button>



<button
class="btn btn-download"
id="deleteBtn">

🗑️ Supprimer

</button>


</div>



</div>

</div>








<!-- ================= MODAL DOWNLOAD ================= -->


<div id="downloadModal"
class="popup hidden">


<div class="modal">


<h2>

Téléchargement

</h2>


<p id="downloadName">

Application

</p>



<div class="progress-box">

<div id="progressBar"
class="progress">

</div>

</div>




<button
class="btn btn-download"
id="confirmDownload">

Confirmer

</button>



<button
class="btn btn-view"
id="cancelDownload">

Annuler

</button>


</div>

</div>







<!-- ================= SCRIPT ================= -->


<script type="module"
src="app.js">

</script>



</body>

</html>
