<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Davbot APK Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://i.imgur.com/naY3qiQ.jpeg">

<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:linear-gradient(135deg,#081a2f,#0b3c66,#0f5fa5);color:#fff}
header{padding:20px;text-align:center;background:rgba(0,0,0,.4)}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:#081a2a;border-radius:18px;padding:20px;margin-bottom:25px;box-shadow:0 15px 35px rgba(0,0,0,.6)}
.app-top{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.icon{width:90px;height:90px;border-radius:18px;border:3px solid #4da3ff}
.badge{background:#123d66;padding:5px 14px;border-radius:20px;font-size:13px}
.status-on{color:#00ff99}
.btn{padding:10px 18px;border-radius:10px;border:none;background:linear-gradient(135deg,#4da3ff,#1e90ff);color:#fff;font-weight:bold;cursor:pointer;margin:5px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
.hidden{display:none}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #4da3ff;padding:10px;text-align:center;transition: all 0.3s;}
tr.updated{animation:updateFlash 0.7s;}
@keyframes updateFlash{0%{background:#081a2a;}50%{background:#1e90ff;}100%{background:#081a2a;}}
.stars{display:flex;gap:2px;margin-top:5px;cursor:pointer}
.star{color:#ffd700;font-size:18px;transition: transform 0.2s, color 0.2s;}
.star:hover{transform: scale(1.3); color:#ffea00;}
.balance-card{background:#123d66;padding:15px;border-radius:15px;margin-top:15px;text-align:center;font-size:18px;transition:all 0.5s;}
.balance-card.pulse{animation:pulseBalance 1s ease-in-out;}
@keyframes pulseBalance{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
#chartContainer{margin-top:20px;background:#081a2a;padding:20px;border-radius:15px}
/* Notifications */
#notifications{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;z-index:999}
.notif{background:#1e90ff;padding:12px 20px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.3);color:#fff;font-weight:bold;opacity:0;transition:opacity 0.5s;}
/* Progress bar */
.progress-container{width:100%;background:#123d66;border-radius:8px;margin-top:5px;height:20px}
.progress-bar{height:100%;width:0%;background:#4da3ff;border-radius:8px;text-align:center;line-height:20px;color:#fff;font-weight:bold;transition:width 0.3s;}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="init()">

<header>
<h1>📦 Davbot APK Store</h1>
<p id="hello"></p>
<button class="btn" onclick="logout()">Déconnexion</button>
</header>

<div class="container">

<!-- AUTH -->
<div id="auth" class="card">
<h2>Créer / Se connecter</h2>
<input id="name" placeholder="Nom">
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Mot de passe">
<button class="btn" onclick="register()">Créer un compte</button>
<button class="btn" onclick="login()">Connexion</button>
</div>

<!-- APPS -->
<div id="apps"></div>

<!-- GAINS -->
<div id="gains" class="card hidden">
<h2>📊 Tableau des gains</h2>
<p>Solde : <b id="balance">0 $</b></p>
<div id="balanceCard" class="balance-card hidden">💳 Carte bancaire : 0 $</div>
<table>
<thead>
<tr><th>Application</th><th>Téléchargements</th><th>Monétisée</th><th>Étoiles</th><th>Gains/Jour</th></tr>
</thead>
<tbody id="gainTable"></tbody>
</table>

<div id="chartContainer">
<canvas id="balanceChart"></canvas>
</div>
</div>

</div>

<!-- Notifications -->
<div id="notifications"></div>

<script>
/* ================= SÉCURITÉ ================= */
function hash(str){return btoa(str.split("").reverse().join(""))}
document.addEventListener("contextmenu",e=>e.preventDefault());
document.onkeydown=e=>{
 if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&["I","J","C"].includes(e.key))){alert("Action bloquée");return false;}
};

/* ================= APPS ================= */
let APPS=[
 {id:"davbot",name:"Davbot Premium",icon:"https://i.imgur.com/naY3qiQ.jpeg",desc:"Application IA intelligente",apk:"https://raw.githubusercontent.com/davbotapp/Davbot-premium-/main/Public/Davbot%20App%20(2).apk",pass:hash("davbot123"),online:true,rating:5,gain:5},
 {id:"vpn",name:"Davbot VPN",icon:"https://via.placeholder.com/100?text=VPN",desc:"VPN rapide et sécurisé",apk:"#",pass:hash("vpn123"),online:true,rating:4,gain:2},
 {id:"chatbot",name:"Chat IA",icon:"https://via.placeholder.com/100?text=IA",desc:"Chat intelligent avec IA",apk:"#",pass:hash("chat123"),online:true,rating:1,gain:8},
 {id:"gamex",name:"Game X",icon:"https://via.placeholder.com/100?text=GameX",desc:"Jeu mobile fun",apk:"#",pass:hash("game123"),online:true,rating:2,gain:3},
];

/* Charger ratings depuis localStorage si existant */
const savedRatings = JSON.parse(localStorage.getItem("apps_rating"));
if(savedRatings) APPS = savedRatings;

/* ================= USER ================= */
const getUser=()=>JSON.parse(localStorage.getItem("user"));
const saveUser=u=>localStorage.setItem("user",JSON.stringify(u));
const logout=()=>{localStorage.removeItem("user");location.reload();}

/* ================= INIT ================= */
function init(){renderApps();checkLogin();checkPayment();simulateDailyGains();}

/* ================= GREETING ================= */
function greet(){
 const u=getUser();if(!u)return;
 const h=new Date().getHours();
 document.getElementById("hello").innerText=(h>=6&&h<18?"Bonjour":"Bonsoir")+" "+u.name;
}

/* ================= AUTH ================= */
function register(){
 const nameVal=document.getElementById("name").value.trim();
 const emailVal=document.getElementById("email").value.trim();
 const passVal=document.getElementById("pass").value.trim();
 if(!nameVal||!emailVal||!passVal){alert("Remplis tous les champs");return;}
 saveUser({name:nameVal,email:emailVal,pass:hash(passVal),balance:0,lastPay:Date.now(),lock:false,payDates:{},history:[]});
 location.reload();
}
function login(){
 const emailVal=document.getElementById("email").value.trim();
 const passVal=document.getElementById("pass").value.trim();
 const u=getUser();
 if(!u||u.email!==emailVal||u.pass!==hash(passVal)){alert("Identifiants incorrects");return;}
 location.reload();
}
function checkLogin(){
 const u=getUser();
 if(u){document.getElementById("auth").classList.add("hidden");greet();showGains();}
}

/* ================= APPS RENDER ================= */
function renderApps(){
 const box=document.getElementById("apps");box.innerHTML="";
 const u=getUser();
 APPS.forEach(a=>{
  const dl=Number(localStorage.getItem("dl_"+a.id)||0);
  const mon=localStorage.getItem("mon_"+a.id);
  const starsContainer = Array.from({length:5},(_,i)=>`<span class="star" data-app="${a.id}" data-star="${i+1}">${i<a.rating?'★':'☆'}</span>`).join('');
  box.innerHTML+=`
  <div class="card">
   <div class="app-top">
    <img src="${a.icon}" class="icon">
    <div>
     <h2>${mon?'⚡ ':''}${a.name}</h2>
     <span class="badge">${a.online?"🟢 En ligne":"🔴 Hors ligne"}</span>
     <p>${a.desc}</p>
     <div class="stars">${starsContainer}</div>
     <p>Téléchargements : <b id="dl_${a.id}">${dl}</b></p>
     <div class="progress-container hidden" id="progress_${a.id}"><div class="progress-bar" id="bar_${a.id}">0%</div></div>
     <a class="btn" href="#" onclick="download('${a.id}')">Télécharger APK</a>
     ${u?`<button class="btn" onclick="monetize('${a.id}')">${mon?'Monétisé':'Monétiser'}</button>`:""}
    </div>
   </div>
  </div>`;
 });

 // Étoiles interactives
 document.querySelectorAll('.star').forEach(star=>{
   star.addEventListener('click',e=>{
     const appId = e.target.dataset.app;
     const starVal = parseInt(e.target.dataset.star);
     const app = APPS.find(a=>a.id===appId);
     app.rating = starVal;
     localStorage.setItem("apps_rating",JSON.stringify(APPS));
     renderApps();
   });
 });
}

/* ================= DOWNLOAD + PROGRESS BAR ================= */
function download(id){
 if(!confirm("Télécharger cette application ?"))return;
 const container = document.getElementById("progress_"+id);
 const bar = document.getElementById("bar_"+id);
 container.classList.remove("hidden");
 let width=0;
 const interval = setInterval(()=>{
   width+=5;
   bar.style.width = width + "%";
   bar.innerText = width+"%";
   if(width>=100){
     clearInterval(interval);
     showNotification(`📦 ${id} téléchargé !`);
     let v=Number(localStorage.getItem("dl_"+id)||0)+1;
     localStorage.setItem("dl_"+id,v);
     document.getElementById("dl_"+id).innerText=v;
     setTimeout(()=>container.classList.add("hidden"),1000);
   }
 },100);
}

/* ================= MONÉTISATION ================= */
function monetize(id){
 const u=getUser();if(!u){alert("Crée un compte d'abord");return;}
 const app=APPS.find(a=>a.id===id);
 const input=prompt("Mot de passe de l'application");
 if(!input||hash(input.trim())!==app.pass){alert("Mot de passe incorrect");return;}
 localStorage.setItem("mon_"+id,"1");
 showNotification(`✅ Monétisation activée pour ${app.name}`);
 renderApps();
 showGains();
}

/* ================= GAINS ================= */
function showGains(){
 const u=getUser();if(!u)return;
 document.getElementById("gains").classList.remove("hidden");
 document.getElementById("balanceCard").classList.remove("hidden");
const balanceEl = document.getElementById("balanceCard");
balanceEl.classList.add("pulse");

const prev = parseInt(balanceEl.dataset.prevBalance || 0);
const target = u.balance;
animateBalance(prev,target);
balanceEl.dataset.prevBalance = target;

document.getElementById("balance").innerText=u.balance+" $";

const t=document.getElementById("gainTable");t.innerHTML="";
APPS.forEach(a=>{
  if(!localStorage.getItem("mon_"+a.id)) return; // affiche seulement les applis monétisées
  const row = document.createElement("tr");
  row.className="updated";
  row.innerHTML=`
    <td>⚡ ${a.name}</td>
    <td>${localStorage.getItem("dl_"+a.id)||0}</td>
    <td>Oui</td>
    <td>${Array.from({length:5},(_,i)=>i<a.rating?'★':'☆').join('')}</td>
    <td>${a.gain} $</td>
  `;
  t.appendChild(row);
});

// Graphique
const ctx = document.getElementById('balanceChart').getContext('2d');
const history = u.history || [];
const labels = history.map((h,i)=>"Jour "+(i+1));
const data = history.map(h=>h.balance);
if(window.balanceChart) window.balanceChart.destroy();
window.balanceChart = new Chart(ctx, {
    type: 'line',
    data: {labels, datasets:[{label:"Solde ($)",data,borderColor:"#4da3ff",backgroundColor:"transparent",tension:0.3}]},
    options:{responsive:true,plugins:{legend:{labels:{color:"#fff"}}},scales:{x:{ticks:{color:"#fff"}},y:{ticks:{color:"#fff"}}}}
});
}

/* ================= NOTIFICATIONS ================= */
function showNotification(message){
 const container = document.getElementById("notifications");
 const notif = document.createElement("div");
 notif.className="notif";
 notif.innerText = message;
 container.appendChild(notif);
 setTimeout(()=>notif.style.opacity="1",50);
 setTimeout(()=>{
   notif.style.opacity="0";
   setTimeout(()=>notif.remove(),500);
 },3000);
}

/* ================= SIMULATION GAIN QUOTIDIEN AVEC NOTIF ================= */
function simulateDailyGains(){
 const u=getUser();if(!u)return;
 setInterval(()=>{
   let updated=false;
   APPS.forEach(a=>{
     if(localStorage.getItem("mon_"+a.id)){
       u.balance += a.gain;
       updated=true;
       showNotification(`💰 Vous avez reçu ${a.gain}$ de ${a.name}!`);
       if(!u.history) u.history=[];
       u.history.push({date:Date.now(), balance:u.balance});
     }
   });
   if(updated) saveUser(u);
   showGains();
 }, 5000);
}

/* ================= ANIMATION SOLDE ================= */
function animateBalance(start,end){
 const balanceEl = document.getElementById("balanceCard");
 let current = start;
 const step = (end-start)/20;
 const interval = setInterval(()=>{
   current += step;
   if((step>0 && current>=end) || (step<0 && current<=end)){
     current=end;
     clearInterval(interval);
   }
   balanceEl.innerText="💳 Carte bancaire : "+Math.floor(current)+" $";
 },50);
}

/* ================= PAIEMENT DYNAMIQUE ================= */
function checkPayment(){
 const u=getUser();if(!u)return;
 const now=Date.now(),delay=172800000; // 2 jours
 APPS.forEach(a=>{
  if(localStorage.getItem("mon_"+a.id)){
    if(!u.payDates) u.payDates={};
    if(!u.payDates[a.id]) u.payDates[a.id]=now;
    if(now - u.payDates[a.id] >= delay){
      u.balance += a.gain;
      u.payDates[a.id] = now;
      if(!u.history) u.history=[];
      u.history.push({date:now,balance:u.balance});
      saveUser(u);
      showGains();
    }
  }
 });
 setTimeout(checkPayment,3600000);
}
</script>

</body>
</html>
