<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">


<title>⚡ Davbot APK Store Premium</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">



<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Poppins,sans-serif;

}



body{


background:

radial-gradient(circle at top,#123b78,#020617 50%);


color:white;

min-height:100vh;


}





/* ================= HEADER ================= */


header{


padding:35px 20px;


text-align:center;


overflow:hidden;


position:relative;


}



header:before{


content:"";


position:absolute;


width:300px;

height:300px;


background:#1e90ff;


filter:blur(120px);


top:-150px;


left:50%;


transform:translateX(-50%);


opacity:.5;


}





.logo{


position:relative;


font-size:38px;


font-weight:800;


color:#4da3ff;


text-shadow:


0 0 15px #1e90ff,

0 0 40px #00ffff;


}



.premium{


margin-top:10px;


color:#ffd700;


font-weight:600;


text-shadow:


0 0 15px gold;


}







/* ================= CONTAINER ================= */


.container{


width:100%;


max-width:1200px;


margin:auto;


padding:20px;


}







/* ================= BANNER ================= */


.banner{


display:flex;


align-items:center;


justify-content:space-between;


padding:30px;


border-radius:30px;


background:


linear-gradient(135deg,#020617,#0b3470,#020617);


border:1px solid #ffd700;


box-shadow:


0 0 35px #1e90ff55;



}



.banner h1{


font-size:30px;


}



.banner h1 span{


color:#ffd700;


}




.banner p{


margin-top:12px;


opacity:.8;


}




.banner img{


width:130px;


height:130px;


border-radius:30px;


border:2px solid gold;


box-shadow:


0 0 30px gold;


}




</style>

</head>


<body>



<header>


<div class="logo">

⚡ DAVBOT APK STORE

</div>


<div class="premium">

👑 PREMIUM ANDROID MARKET

</div>


</header>



<div class="container">



<div class="banner">


<div>


<h1>

Télécharge les

<span>

meilleures Apps

</span>

Android

</h1>


<p>

IA • VPN • Jeux • Outils • Applications Premium

</p>


</div>


<img src="https://i.ibb.co/chckV4z9/Dav-Bot-IA-128x128-4ko.webp">


</div>
<!-- ================= RECHERCHE ================= -->


<div class="search-box">


<input

id="search"

type="text"

placeholder="🔎 Rechercher une application...">


</div>






<!-- ================= CATEGORIES ================= -->


<div class="categories">


<button class="category active">

Tous

</button>


<button class="category">

IA

</button>


<button class="category">

VPN

</button>


<button class="category">

Jeux

</button>


<button class="category">

Outils

</button>


<button class="category">

Social

</button>


</div>






<!-- ================= TITRE ================= -->


<h2 class="title">


🔥 Applications disponibles


</h2>





<!-- ================= LISTE APK ================= -->


<div id="apps" class="apps-grid">


<!-- Les APK seront ajoutés par app.js -->


</div>









<style>



/* ================= SEARCH ================= */



.search-box{


margin-top:25px;


}



.search-box input{


width:100%;


padding:16px 20px;


border-radius:25px;


background:#020617;


border:1px solid #1e90ff;


color:white;


outline:none;


font-size:15px;


box-shadow:


0 0 20px #1e90ff44;


}




.search-box input:focus{


box-shadow:


0 0 30px #1e90ff;


}








/* ================= CATEGORIES ================= */


.categories{


display:flex;


gap:12px;


overflow-x:auto;


margin:25px 0;


}



.categories::-webkit-scrollbar{


display:none;


}




.category{


padding:10px 20px;


border-radius:30px;


background:#081126;


border:1px solid #1e90ff;


color:#4da3ff;


cursor:pointer;


white-space:nowrap;


}




.category:hover,
.category.active{


background:#ffd700;


color:#020617;


border-color:#ffd700;


box-shadow:


0 0 20px gold;


}





/* ================= TITLE ================= */


.title{


margin:30px 0 20px;


color:#ffd700;


text-shadow:


0 0 15px gold;


}






/* ================= APK GRID ================= */


.apps-grid{


display:grid;


grid-template-columns:


repeat(auto-fit,minmax(280px,1fr));


gap:20px;


}



</style>
<!-- ================= POPUP DETAILS APK ================= -->


<div id="detailsModal" class="modal hidden">


<div class="modal-content">


<img id="detailIcon" class="detail-icon">



<h2 id="detailName">

Nom Application

</h2>



<div id="detailStars" class="stars">

★★★★★

</div>



<p id="detailDesc">

Description

</p>




<div class="tags">


<span id="detailVersion">

Version

</span>


<span id="detailSize">

Taille

</span>


<span id="detailCategory">

Catégorie

</span>


</div>





<button id="detailDownload" class="download-btn">

📥 Télécharger APK

</button>




<button onclick="closeDetails()" class="close-btn">

Fermer

</button>



</div>


</div>







<style>



/* ================= APK CARD ================= */


.app-card{


background:

linear-gradient(145deg,#020617,#081126);


padding:20px;


border-radius:30px;


border:1px solid #ffd70055;


box-shadow:


0 0 25px #1e90ff33;


transition:.3s;


}




.app-card:hover{


transform:translateY(-7px);


box-shadow:


0 0 30px #1e90ff,

0 0 25px gold;


}





.app-top{


display:flex;


align-items:center;


gap:15px;


}





.app-icon{


width:85px;


height:85px;


border-radius:25px;


object-fit:cover;


border:2px solid gold;


box-shadow:


0 0 20px gold;


}




.app-card h3{


color:#4da3ff;


font-size:21px;


}



.dev{


font-size:13px;


opacity:.7;


}




.description{


margin:15px 0;


line-height:1.5;


opacity:.85;


}





.stars{


color:#ffd700;


font-size:20px;


margin:10px 0;


}





.badges span,
.tags span{


display:inline-block;


padding:6px 12px;


margin:5px;


border-radius:20px;


background:#081126;


border:1px solid #1e90ff;


color:#4da3ff;


font-size:12px;


}





.download-btn{


width:100%;


margin-top:15px;


padding:14px;


border-radius:25px;


background:#ffd700;


color:#020617;


font-weight:bold;


border:none;


cursor:pointer;


box-shadow:


0 0 20px gold;


}





/* ================= MODAL ================= */



.modal{


position:fixed;


inset:0;


background:#000b;


display:flex;


align-items:center;


justify-content:center;


z-index:999;


}





.hidden{


display:none;


}





.modal-content{


width:90%;


max-width:420px;


background:#020617;


padding:30px;


border-radius:30px;


text-align:center;


border:1px solid gold;


box-shadow:


0 0 40px #1e90ff;


}





.detail-icon{


width:110px;


height:110px;


border-radius:30px;


border:2px solid gold;


box-shadow:


0 0 25px gold;


}





.modal-content h2{


color:#4da3ff;


margin:15px;


}




.close-btn{


margin-top:15px;


padding:12px 25px;


border-radius:25px;


background:#020617;


color:white;


border:1px solid #1e90ff;


cursor:pointer;


}


</style>






<script>


function closeDetails(){


document

.getElementById("detailsModal")

.classList.add("hidden");


}


</script>





<script type="module" src="app.js"></script>



</body>


</html>
