

 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Davbot APK Store</title>
 <meta name="google-site-verification" content="YvfIvLYwUp-8q6YSySsEBCG2iuqVcRpz8kEAY4XLDfM" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://i.imgur.com/naY3qiQ.jpeg">

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:linear-gradient(135deg,#081a2f,#0b3c66,#0f5fa5);color:#fff}
header{text-align:center;padding:20px;background:rgba(0,0,0,.4)}
.container{max-width:1200px;margin:auto;padding:20px}
.card{background:#081a2a;border-radius:18px;padding:20px;margin-bottom:25px;box-shadow:0 15px 35px rgba(0,0,0,.6)}
.app{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.icon{width:90px;height:90px;border-radius:18px;border:3px solid #4da3ff}
.btn{padding:10px 18px;border:none;border-radius:10px;background:#1e90ff;color:#fff;font-weight:bold;cursor:pointer;margin:5px}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}
.hidden{display:none}
.stars{color:gold;font-size:18px}
.desc{opacity:.9;margin:8px 0}
.balance{background:#123d66;padding:15px;border-radius:15px;text-align:center;font-size:18px;margin:15px 0;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;border-bottom:1px solid #4da3ff;text-align:center}
.flash{animation:flash 1s}
@keyframes flash{0%{background:#1e90ff}100%{background:transparent}}
</style>
</head>

<body onload="init()">

<header>
<h1>📦 Davbot APK Store</h1>
<p id="hello"></p>
<button class="btn hidden" id="logoutBtn" onclick="logout()">Déconnexion</button>
</header>

<div class="container">

<!-- AUTH -->
<div id="auth" class="card">
<h2>Créer / Se connecter</h2>
<input id="name" placeholder="Nom">
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Mot de passe">
<button class="btn" onclick="register()">Créer un compte</button>
<button class="btn" onclick="login()">Connexion</button>
</div>

<!-- APPS -->
<div id="apps"></div>

<!-- DASHBOARD -->
<div id="dashboard" class="card hidden">
<h2>📊 Tableau de bord</h2>
<div class="balance" id="balance">💳 Carte bancaire : 0 $</div>
<button class="btn" onclick="withdraw()">💸 Récupérer l'argent</button>

<table>
<thead>
<tr><th>Application</th><th>Téléchargements</th><th>Gain / 48h</th></tr>
</thead>
<tbody id="dashTable"></tbody>
</table>
</div>

</div>

<script>
/* ===== Utils ===== */
const hash=s=>btoa(s.split("").reverse().join(""));
const getUser=()=>JSON.parse(localStorage.getItem("user"));
const saveUser=u=>localStorage.setItem("user",JSON.stringify(u));
const logout=()=>{localStorage.clear();location.reload();};

/* ===== Applications ===== */
const APPS=[
{
 id:"davbot",
 name:"Davbot App",
 icon:"https://i.ibb.co/M5sJH30L/mysterious-hacker-figure-sitting-dark-260nw-2675788995.webp",
 desc:"Assistant intelligent basé sur l’IA. Discussions, aide, automatisation et réponses rapides.", apk:"https://github.com/davbotapp/Davbot-premium-/raw/main/Davbot.apk ",
 stars:5,
 gain:5,
 pass:hash("davbot2025")
},
{
 id:"telegram",
 name:"Telegram FOSS",
 icon:"https://raw.githubusercontent.com/Telegram-FOSS-Team/Telegram-FOSS/master/fastlane/metadata/android/en-US/images/icon.png",
 desc:"Version open‑source de Telegram. Messagerie rapide, sécurisée et sans trackers.",
 apk:"https://github.com/Telegram-FOSS-Team/Telegram-FOSS/releases/latest/download/app-arm64-v8a-release.apk",
 stars:5,
 gain:4,
 pass:hash("telegram")
},

{
 id:"termux",
 name:"Termux",
 icon:"https://raw.githubusercontent.com/termux/termux-app/master/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png",
 desc:"Terminal Linux puissant sur Android. Développement, scripts et serveurs.",
 apk:"https://github.com/termux/termux-app/releases/latest/download/app-release.apk",
 stars:5,
 gain:6,
 pass:hash("termux")
},
{
 id:"signal",
 name:"Signal",
 desc:"Messagerie privée avec chiffrement de bout en bout.",
 icon:"https://signal.org/assets/images/header/logo.png",
 apk:"https://github.com/signalapp/Signal-Android/releases/latest/download/Signal-Android.apk",
 stars:5,
 gain:4,
 pass:hash("signal123")
},
{
 id:"vlc",
 name:"VLC Android",
 desc:"Lecteur multimédia puissant et universel.",
 icon:"https://raw.githubusercontent.com/videolan/vlc-android/master/application/resources/assets/images/icon.png",
 apk:"https://github.com/videolan/vlc-android/releases/latest/download/vlc-android.apk",
 stars:4,
 gain:3,
 pass:hash("vlc123")
},
{
 id:"hatunnel",
 name:"HA Tunnel",
 desc:"Application tunnel pour VPN, SSH et connexions sécurisées.",
 icon:"https://i.imgur.com/sfiqeZ3.jpeg",
 apk:"#",
 stars:4,
 gain:4,
 pass:hash("hatunnel123")
},
{
 id:"socksip",
 name:"SocksIP Tunnel",
 desc:"Tunnel VPN basé sur SSH et Socks pour internet gratuit.",
 icon:"https://i.imgur.com/JCXiqOf.jpeg",
 apk:"#",
 stars:4,
 gain:4,
 pass:hash("socksip123")
},

{
 id:"napsternet",
 name:"NapsternetV",
 desc:"Client VPN open‑source basé sur V2Ray et SSH.",
 icon:"https://raw.githubusercontent.com/napsternetv/napsternetv/master/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png",
 apk:"https://github.com/napsternetv/napsternetv/releases/latest/download/app-release.apk",
 stars:5,
 gain:6,
 pass:hash("napster123")
},

];

/* ===== INIT ===== */
function init(){
 renderApps();
 checkLogin();
 setInterval(updateGains,60000);
}

/* ===== Auth ===== */
function register(){
 const nameVal=document.getElementById("name").value.trim();
 const emailVal=document.getElementById("email").value.trim();
 const passVal=document.getElementById("pass").value.trim();
 if(!nameVal||!emailVal||!passVal) return alert("Remplis tous les champs");
 saveUser({name:nameVal,email:emailVal,pass:hash(passVal),balance:0,lastGain:Date.now()});
 location.reload();
}
function login(){
 const emailVal=document.getElementById("email").value.trim();
 const passVal=document.getElementById("pass").value.trim();
 const u=getUser();
 if(!u||u.email!==emailVal||u.pass!==hash(passVal))
 return alert("Email ou mot de passe incorrect");
 location.reload();
}
function checkLogin(){
 const u=getUser();
 if(!u) return;
 document.getElementById("auth").classList.add("hidden");
 document.getElementById("logoutBtn").classList.remove("hidden");
 document.getElementById("hello").innerText=(new Date().getHours()<18?"Bonjour ":"Bonsoir ")+u.name;
 updateDashboard();
}

/* ===== Render Apps ===== */
function renderApps(){
 const box=document.getElementById("apps"); box.innerHTML="";
 const u=getUser();
 APPS.forEach(a=>{
 const dl=localStorage.getItem("dl_"+a.id)||0;
 box.innerHTML+=`
 <div class="card">
  <div class="app">
   <img src="${a.icon}" class="icon" alt="${a.name}">
   <div>
    <h2>${a.name}</h2>
    <div class="stars">${"★".repeat(a.stars)}</div>
    <p class="desc">${a.desc}</p>
    <p>Téléchargements : ${dl}</p>
    <a class="btn" href="${a.apk}" onclick="download('${a.id}')">Télécharger APK</a>
    ${u?`<button class="btn" onclick="monetize('${a.id}')">Monétiser</button>`:""}
   </div>
  </div>
 </div>`;
 });
}

function download(id){
 let v=Number(localStorage.getItem("dl_"+id)||0)+1;
 localStorage.setItem("dl_"+id,v);
}

/* ===== Monetization ===== */
function monetize(id){
 const app=APPS.find(a=>a.id===id);
 const p=prompt("Mot de passe de l'application");
 if(!p||hash(p)!==app.pass) return alert("Mot de passe incorrect");
 localStorage.setItem("mon_"+id,"1");
 updateDashboard();
}

/* ===== Dashboard ===== */
function updateDashboard(){
 const u=getUser(); if(!u) return;
 document.getElementById("dashboard").classList.remove("hidden");
 document.getElementById("balance").innerText="💳 Carte bancaire : "+u.balance+" $";
 const t=document.getElementById("dashTable"); t.innerHTML="";
 APPS.forEach(a=>{
 if(localStorage.getItem("mon_"+a.id)){
 t.innerHTML+=`
 <tr class="flash">
  <td>⚡ ${a.name}</td>
  <td>${localStorage.getItem("dl_"+a.id)||0}</td>
  <td>${a.gain} $ / 48h</td>
 </tr>`;
 }
 });
}

/* ===== Gains ===== */
function updateGains(){
 const u=getUser(); if(!u) return;
 const TWO_DAYS=172800000;
 if(Date.now()-u.lastGain<TWO_DAYS) return;
 APPS.forEach(a=>{
 if(localStorage.getItem("mon_"+a.id)) u.balance+=a.gain;
 });
 u.lastGain=Date.now();
 saveUser(u);
 updateDashboard();
}

/* ===== Withdraw ===== */
function withdraw(){
 const u=getUser();
 if(u.balance<=0) return alert("Solde insuffisant");
 alert("Demande de retrait envoyée ✔");
 u.balance=0;
 saveUser(u);
 updateDashboard();
}
</script>

</body>
</html>
