<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Davbot APK Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>⚡ Davbot APK Store</h1>
</header>

<div class="container">
<input class="search" placeholder="🔎 Rechercher..." oninput="searchApps(this.value)">
<div id="apps"></div>
</div>

<script>
// Charge la liste des apps depuis apps.json
let APPS = [];
fetch('apps.json')
.then(res=>res.json())
.then(data=>{
  APPS = data;
  renderApps();
});

// Fonction affichage des apps
function renderApps(list=APPS){
  const box = document.getElementById("apps");
  box.innerHTML = "";
  list.forEach(app=>{
    const dl = localStorage.getItem("dl_"+app.id)||0;
    box.innerHTML += `
    <div class="card">
      <img src="${app.icon}" class="icon">
      <h2>${app.name}</h2>
      <p>${app.desc}</p>
      <p>📥 ${dl} téléchargements</p>
      <button class="btn" onclick="downloadApp('${app.id}')">Télécharger</button>
    </div>`;
  });
}

// Recherche
function searchApps(q){
  q=q.toLowerCase();
  renderApps(APPS.filter(a=>a.name.toLowerCase().includes(q)));
}

// Téléchargement
function downloadApp(id){
  const app = APPS.find(a=>a.id===id);
  if(!app) return;

  // compteur
  let count = Number(localStorage.getItem("dl_"+id)||0)+1;
  localStorage.setItem("dl_"+id,count);
  renderApps();

  // téléchargement
  window.open(app.apk,"_blank");
}
</script>
</body>
</html>
