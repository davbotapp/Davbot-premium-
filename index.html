<!DOCTYPE html>

<head>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}


body{

background:
radial-gradient(circle at top,#003cff55,transparent 35%),
linear-gradient(135deg,#020617,#000);

color:white;
min-height:100vh;

overflow-x:hidden;

}



/* BACKGROUND EFFECT */


body::before{

content:"";

position:fixed;

width:400px;
height:400px;

background:#006eff;

filter:blur(150px);

opacity:.25;

top:-100px;
left:-100px;

z-index:-1;

}





/* HEADER SAAS */


.header{


padding:30px 20px;

text-align:center;

background:

rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border-bottom:

1px solid #ffffff20;


}



.logo{


font-size:35px;

font-weight:900;


background:

linear-gradient(90deg,#00c8ff,#ffd700);


-webkit-background-clip:text;

color:transparent;


text-shadow:

0 0 30px #008cff;


}



.subtitle{

color:#aaa;

margin-top:10px;

}




.search-box{


margin-top:25px;

}



#search{


width:90%;

max-width:500px;

padding:16px 25px;

border-radius:50px;

border:none;

outline:none;

background:#050b1c;

color:white;

font-size:16px;


box-shadow:

0 0 25px #006eff88;


}






/* MENU */


.menu{


display:flex;

gap:12px;

padding:20px;

overflow:auto;


}



.category{


background:#081126;

border:1px solid #006eff55;

color:white;

padding:12px 22px;

border-radius:30px;

white-space:nowrap;

}



.category.active{


background:

linear-gradient(90deg,#006eff,#00d9ff);

box-shadow:

0 0 25px #008cff;


}





/* SECTION */


.section-title{


padding:20px;

font-size:25px;

font-weight:800;


}





/* APK GRID */


#apps{


display:grid;

grid-template-columns:

repeat(auto-fit,minmax(280px,1fr));


gap:25px;

padding:20px;


}







/* APK CARD 3D */


.app-card{


background:

linear-gradient(

145deg,

#081126,

#020617

);


border-radius:30px;


padding:25px;


border:

1px solid #006eff55;


box-shadow:


0 20px 50px #000,


inset 0 0 30px #006eff22;


transition:.4s;


position:relative;


overflow:hidden;


}



.app-card::before{


content:"";

position:absolute;

width:150px;
height:150px;

background:#ffd700;

filter:blur(90px);

right:-50px;

top:-50px;

opacity:.2;


}



.app-card:hover{


transform:

translateY(-12px)

rotateX(5deg);


box-shadow:

0 0 40px #006eff,


0 30px 70px #000;


}







.app-icon{


width:95px;

height:95px;

border-radius:25px;

object-fit:cover;


box-shadow:

0 0 30px #006eff;


}





.app-name{


font-size:24px;

margin-top:15px;

}





.dev{

color:#aaa;

}




.info{


display:flex;

justify-content:space-between;

margin:15px 0;

font-size:13px;


}




.badge{


padding:7px 14px;

border-radius:20px;

background:#ffd700;

color:#000;

font-weight:bold;


}




.description{


color:#ccc;

font-size:14px;

min-height:50px;


}






/* DOWNLOAD BUTTON */


.download-btn{


width:100%;

margin-top:20px;

padding:15px;


border:none;

border-radius:25px;


background:

linear-gradient(

90deg,

#006eff,

#00d9ff

);


color:white;

font-size:16px;

font-weight:bold;


cursor:pointer;


box-shadow:

0 0 25px #006eff;


}





.download-btn:hover{


background:

linear-gradient(

90deg,

#ffd700,

#ff9900

);


color:black;


}







/* DOWNLOAD MODAL */


#downloadBox{


position:fixed;

top:50%;

left:50%;


transform:

translate(-50%,-50%);


width:320px;


padding:30px;


border-radius:30px;


background:#050b1c;


border:1px solid #006eff;


box-shadow:

0 0 50px #006eff;


display:none;


text-align:center;


}



.progress{


height:15px;

background:#111827;

border-radius:20px;

overflow:hidden;

margin:20px 0;


}



.bar{


height:100%;

width:0%;


background:

linear-gradient(90deg,#006eff,#ffd700);


}





footer{


text-align:center;

padding:30px;

color:#777;


}


</style>

</head>

function renderApps(list){
