<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Publier APK - Davbot Store</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}


body{

background:#020617;

color:white;

min-height:100vh;

}



header{

padding:25px;

text-align:center;

background:#081126;

border-bottom:1px solid #1e90ff33;

}



header h1{

color:#4da3ff;

text-shadow:0 0 20px #1e90ff;

}



.container{

width:95%;

max-width:600px;

margin:auto;

padding:25px;

}




.card{

background:#081126;

padding:25px;

border-radius:25px;

border:1px solid #1e90ff33;

box-shadow:0 0 25px #1e90ff22;

}





label{

display:block;

margin-top:15px;

margin-bottom:7px;

color:#4da3ff;

}





input,
select,
textarea{

width:100%;

padding:14px;

border-radius:15px;

border:1px solid #1e90ff55;

background:#020617;

color:white;

outline:none;

}



textarea{

height:120px;

resize:none;

}



.file{

margin-top:10px;

}



.preview{

width:100px;

height:100px;

border-radius:25px;

object-fit:cover;

display:none;

margin:15px auto;

box-shadow:0 0 25px #1e90ff;

}



.btn{

width:100%;

margin-top:15px;

padding:15px;

border:none;

border-radius:18px;

background:#1e90ff;

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

}



.btn:hover{

box-shadow:0 0 30px #1e90ff;

}



.update{

background:#00a86b;

}



.delete{

background:#dc2626;

}



.back{

display:block;

text-align:center;

margin-top:20px;

color:#4da3ff;

}




.user-box{

margin-bottom:20px;

padding:15px;

background:#020617;

border-radius:15px;

border:1px solid #1e90ff33;

text-align:center;

}




.progress-container{

display:none;

margin-top:20px;

}



.progress-bg{

height:10px;

background:#111827;

border-radius:20px;

overflow:hidden;

}



.progress{

height:100%;

width:0%;

background:#1e90ff;

transition:.3s;

}




.message{

margin-top:15px;

text-align:center;

color:#4da3ff;

}



</style>

</head>



<body>



<header>

<h1>

⚡ Publier une application

</h1>

</header>





<div class="container">


<div class="card">




<label>
Mot de passe propriétaire
</label>

<input
id="ownerPassword"
type="password"
placeholder="Créer un mot de passe">
<p></p>




<div class="user-box"
id="userInfo">

Connexion...

</div>





<input 
type="hidden"
id="appId">





<img

id="iconPreview"

class="preview">







<label>

Nom de l'application

</label>


<input

id="appName"

placeholder="Ex : Davbot AI">







<label>

Catégorie

</label>


<select id="category">


<option value="IA">

🤖 IA

</option>


<option value="VPN">

🌐 VPN

</option>


<option value="Jeux">

🎮 Jeux

</option>


<option value="Outils">

🛠 Outils

</option>


<option value="Social">

💬 Social

</option>


</select>







<label>

Version

</label>


<input

id="version"

placeholder="1.0.0">







<label>

Taille

</label>


<input

id="size"

placeholder="20 MB">







<label>

Description

</label>


<textarea

id="description"

placeholder="Description de votre application">

</textarea>







<label>

Icône APK

</label>


<input

type="file"

id="iconFile"

accept="image/*">








<label>

Fichier APK

</label>


<input

type="file"

id="apkFile"

accept=".apk">







<div class="progress-container"

id="progressBox">


<div class="progress-bg">


<div class="progress"

id="uploadProgress">

</div>


</div>


</div>







<button

class="btn"

id="publishBtn">

🚀 Publier

</button>








<button

class="btn update"

id="updateBtn"

style="display:none;">

✏️ Modifier

</button>








<button

class="btn delete"

id="deleteBtn"

style="display:none;">

🗑 Supprimer

</button>







<div class="message"

id="message">

</div>







<a href="index.html"

class="back">

⬅ Retour au Store

</a>




</div>

</div>









<script type="module">


import {

initUploadPage

}

from "./app.js";



initUploadPage();



</script>



</body>

</html>
